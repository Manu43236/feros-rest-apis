name: Deploy to Staging EC2

on:
  push:
    branches:
      - main-dev
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests -q

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):stg" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on Stg EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          API_IMAGE: ${{ env.IMAGE }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.STG_EC2_HOST }}
          username: ${{ secrets.STG_EC2_USER }}
          key: ${{ secrets.STG_EC2_SSH_KEY }}
          port: 1995
          envs: API_IMAGE,GHCR_TOKEN,GHCR_ACTOR
          script: |
            sudo mkdir -p /home/ubuntu/feros-stg-web/dist
            sudo chown -R ubuntu:ubuntu /home/ubuntu/feros-stg-web
            cd /home/ubuntu/feros-stg
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            sudo sed -i '/^API_IMAGE=/d' .env 2>/dev/null; echo "API_IMAGE=$API_IMAGE" | sudo tee -a .env
            sudo docker compose pull api
            sudo docker compose up -d --no-build --force-recreate api nginx
            sudo docker image prune -f
            echo "==> Staging deployed successfully!"
            sudo docker compose ps
