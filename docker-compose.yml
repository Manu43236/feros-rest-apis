services:

  mysql:
    image: mysql:8.0
    container_name: feros_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-feros_db}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"   # localhost only — SSH tunnel can reach this
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - feros_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${API_IMAGE}
    container_name: feros_api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-feros_db}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - feros_net

  nginx:
    image: nginx:alpine
    container_name: feros_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/ubuntu/feros-web/dist:/usr/share/nginx/html:ro  # also update in: web repo deploy.yml + api deploy.yml
    depends_on:
      - api
    networks:
      - feros_net

volumes:
  mysql_data:

networks:
  feros_net:
    driver: bridge
